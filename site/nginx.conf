# TLS terminates at the host's Traefik; this only ever sees plain HTTP from it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
        # add_header in a location replaces the server-level set, so each location lists
        # its own. main.js asks the GitHub API for the newest release's download links.
        # Page, styles and script change together and aren't fingerprinted: always revalidate.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location ~* ^/(img|fonts)/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
