name: Release

on:
  push:
    tags:
      - "v*"
  # Lets you exercise the whole pipeline without cutting a tag.
  # Artifacts are produced, but nothing is published to a release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-2022
            asset: windows-x64
          - name: Linux (x86_64)
            os: ubuntu-22.04
            asset: linux-x86_64
          - name: macOS (universal)
            os: macos-14
            asset: macos-universal

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version string
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libxkbcommon-x11-0 libfuse2

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets qtpdf
          cache: true

      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            # Qt's macOS binaries are universal, so the app can be too.
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64")
            EXTRA+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      # ── Package ────────────────────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/PDFOrganizer"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Release/PDFOrganizer.exe $stage/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release --no-translations --compiler-runtime `
            "$stage/PDFOrganizer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "PDFOrganizer-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p pkg

          cat > pkg/PDFOrganizer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PDFOrganizer
          Comment=Organize, tag and search your PDF library
          Exec=PDFOrganizer
          Icon=PDFOrganizer
          Categories=Office;Utility;
          Terminal=false
          EOF

          # linuxdeploy insists on an icon; use the real app icon.
          cp assets/icon.png pkg/PDFOrganizer.png

          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          qtbase=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          curl -sSfLO "$base/linuxdeploy-x86_64.AppImage"
          curl -sSfLO "$qtbase/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage

          # No FUSE on the runners, so let the AppImages self-extract instead.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT="PDFOrganizer-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/PDFOrganizer \
            --desktop-file pkg/PDFOrganizer.desktop \
            --icon-file pkg/PDFOrganizer.png \
            --plugin qt \
            --output appimage

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          "$QT_ROOT_DIR/bin/macdeployqt" build/PDFOrganizer.app -always-overwrite
          # Ad-hoc signature: not notarized, but keeps the bundle launchable
          # after the deploy tool rewrites the embedded frameworks.
          codesign --force --deep --sign - build/PDFOrganizer.app
          hdiutil create \
            -volname PDFOrganizer \
            -srcfolder build/PDFOrganizer.app \
            -ov -format UDZO \
            "PDFOrganizer-${{ steps.version.outputs.version }}-macos-universal.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFOrganizer-${{ matrix.asset }}
          path: |
            PDFOrganizer-*.zip
            PDFOrganizer-*.AppImage
            PDFOrganizer-*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to the tag's release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
